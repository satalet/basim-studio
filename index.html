    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    // --- نظام إدارة المشاريع لباسم ---
    let currentProjectName = "مشروع بدون عنوان";
    let currentProjectId = "proj_" + Date.now();

    function getSavedProjects() {
        try {
            return JSON.parse(localStorage.getItem("basim_projects") || "{}");
        } catch(e) {
            return {};
        }
    }

    function saveCurrentProject(customName = null) {
        if (!frames || frames.length === 0) return;
        // حفظ الفريم الحالي أولاً
        if (typeof paintCanvas !== "undefined" && typeof currentFrameIndex !== "undefined") {
            frames[currentFrameIndex] = paintCanvas.toDataURL("image/png");
        }

        const projects = getSavedProjects();
        const name = customName || prompt("اختر اسماً لمشروعك يا فنان:", currentProjectName) || currentProjectName;
        currentProjectName = name;

        projects[currentProjectId] = {
            id: currentProjectId,
            name: name,
            frames: frames,
            thumbnail: frames[0],
            frameCount: frames.length,
            updatedAt: new Date().toLocaleDateString("ar-EG")
        };

        try {
            localStorage.setItem("basim_projects", JSON.stringify(projects));
            alert("✅ تم حفظ مشروع: " + name);
        } catch(e) {
            alert("⚠️ تعذر الحفظ، قد تكون الذاكرة ممتلئة بالرسومات.");
        }
    }

    function openProjectsModal() {
        const modal = document.getElementById("projectsModal");
        const list = document.getElementById("projectsListContainer");
        const projects = getSavedProjects();
        const keys = Object.keys(projects);

        if (keys.length === 0) {
            list.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-sm">
                <i class="fa-solid fa-palette text-3xl mb-2 text-slate-600 block"></i>
                لا توجد مشاريع محفوظة بعد. ابدأ برسم شخصية واحفظها!
            </div>`;
        } else {
            list.innerHTML = keys.map(k => {
                const p = projects[k];
                return `
                <div class="bg-studio-800 border border-slate-700/60 rounded-xl p-3 flex flex-col items-center gap-2 group hover:border-indigo-500 transition">
                    <img src="${p.thumbnail}" class="w-full h-28 object-contain bg-white rounded-lg border border-slate-700">
                    <div class="w-full text-right">
                        <div class="font-bold text-white text-xs truncate" title="${p.name}">${p.name}</div>
                        <div class="text-[10px] text-slate-400 flex justify-between mt-1">
                            <span>${p.frameCount} فريم</span>
                            <span>${p.updatedAt}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 w-full mt-1">
                        <button onclick="loadSavedProject('${p.id}')" class="flex-1 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-[11px] font-bold transition">فتح</button>
                        <button onclick="exportProjectFile('${p.id}')" class="p-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-[11px]" title="تنزيل ملف .basim"><i class="fa-solid fa-download"></i></button>
                        <button onclick="deleteSavedProject('${p.id}')" class="p-1 bg-rose-900/60 hover:bg-rose-600 text-rose-300 hover:text-white rounded text-[11px]" title="حذف"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            }).join("");
        }

        modal.classList.remove("hidden");
        modal.classList.add("flex");
    }

    function closeProjectsModal() {
        const modal = document.getElementById("projectsModal");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
    }

    function loadSavedProject(id) {
        const projects = getSavedProjects();
        const p = projects[id];
        if (!p) return;

        if (confirm("هل تريد فتح مشروع (" + p.name + ")؟ تأكد من حفظ عملك الحالي.")) {
            currentProjectId = p.id;
            currentProjectName = p.name;
            frames = [...p.frames];
            currentFrameIndex = 0;

            const filmstrip = document.getElementById("filmstrip");
            if (filmstrip) filmstrip.innerHTML = "";
            for (let i = 0; i < frames.length; i++) {
                addThumbnailToFilmstrip(i);
            }
            loadFrame(0);
            closeProjectsModal();
        }
    }

    function deleteSavedProject(id) {
        if (!confirm("هل أنت متأكد من حذف هذا المشروع؟")) return;
        const projects = getSavedProjects();
        delete projects[id];
        localStorage.setItem("basim_projects", JSON.stringify(projects));
        openProjectsModal();
    }

    function createNewProject() {
        if (!confirm("بدء مشروع جديد فارغ؟ تأكد من حفظ مشروعك أولاً.")) return;
        currentProjectId = "proj_" + Date.now();
        currentProjectName = "مشروع جديد";
        frames = [];
        currentFrameIndex = 0;

        const temp = document.createElement("canvas");
        temp.width = 500;
        temp.height = 500;
        const ctx = temp.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 500, 500);

        frames.push(temp.toDataURL("image/png"));
        const filmstrip = document.getElementById("filmstrip");
        if (filmstrip) filmstrip.innerHTML = "";
        addThumbnailToFilmstrip(0);
        loadFrame(0);
    }

    function exportProjectFile(id) {
        const projects = getSavedProjects();
        const p = projects[id];
        if (!p) return;
        const blob = new Blob([JSON.stringify(p, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${p.name}.basim`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importProjectFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (!imported.frames || !Array.isArray(imported.frames)) throw new Error("ملف غير صالح");
                const projects = getSavedProjects();
                const newId = "proj_" + Date.now();
                imported.id = newId;
                projects[newId] = imported;
                localStorage.setItem("basim_projects", JSON.stringify(projects));
                openProjectsModal();
                alert("✅ تم استيراد المشروع بنجاح!");
            } catch(err) {
                alert("⚠️ فشل استيراد الملف. تأكد أنه ملف .basim صحيح.");
            }
        };
        reader.readAsText(file);
    }

</script>

<script>
let dubMediaRec = null;
let dubAudioChunks = [];
let dubAudioBlob = null;
let dubAudioPlayer = new Audio();
let dubAudioStream = null;
let readyVideoFile = null;
let dubState = 'idle'; // 'idle', 'recording', 'ready'

function handleDubAction() {
    if (dubState === 'idle') {
        startDubbing();
    } else if (dubState === 'recording') {
        stopDubbingAndRender();
    } else if (dubState === 'ready') {
        triggerInstantWhatsAppShare();
    }
}

async function startDubbing() {
    // 1. حفظ ما رسمه باسم على الكانفاس حالياً لمنع أي فريم أبيض
    if (typeof saveActiveFrame === 'function') saveActiveFrame();

    if (!frames || frames.length === 0) {
        showToast("ارسم فكرة أولاً على الكانفاس يا بطل!", "palette");
        return;
    }

    try {
        dubAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        dubAudioChunks = [];
        dubMediaRec = new MediaRecorder(dubAudioStream);
        dubMediaRec.ondataavailable = e => { if (e.data.size > 0) dubAudioChunks.push(e.data); };

        dubMediaRec.start();
        dubState = 'recording';

        const btn = document.getElementById('btnDirectDub');
        const txt = document.getElementById('dubText');
        const dot = document.getElementById('dubDot');
        
        btn.className = "px-2.5 py-1.5 bg-rose-600 active:scale-95 text-white rounded-xl text-xs font-black flex items-center gap-1 animate-pulse shadow-lg transition";
        txt.innerText = "إنهاء ⏹️";
        dot.className = "w-2 h-2 rounded-full bg-yellow-300 inline-block";

        if (!isPlaying) startPlayback();
        showToast("🔴 جارٍ الحركة والتسجيل... تكلّم ودبلج الآن!", "microphone");

    } catch (err) {
        alert("يرجى إعطاء المتصفح إذن الميكروفون.");
    }
}

async function stopDubbingAndRender() {
    const btn = document.getElementById('btnDirectDub');
    const txt = document.getElementById('dubText');
    const dot = document.getElementById('dubDot');

    txt.innerText = "⏳ بنجهز...";
    btn.className = "px-2.5 py-1.5 bg-slate-700 text-slate-300 rounded-xl text-xs font-black flex items-center gap-1 transition";

    stopPlayback();

    dubMediaRec.onstop = async () => {
        dubAudioBlob = new Blob(dubAudioChunks, { type: 'audio/webm' });
        dubAudioPlayer.src = URL.createObjectURL(dubAudioBlob);
        
        if (dubAudioStream) {
            dubAudioStream.getTracks().forEach(t => t.stop());
        }

        // تجهيز ملف الفيديو كاملاً بالخلفية الآن!
        await preRenderVideoFile();

        // تحويل الزر إلى زر الواتساب الجاهز
        dubState = 'ready';
        btn.className = "px-2.5 py-1.5 bg-gradient-to-r from-emerald-500 to-teal-600 active:scale-95 text-white rounded-xl text-xs font-black flex items-center gap-1 shadow-md shadow-emerald-500/30 transition animate-bounce";
        txt.innerHTML = "واتساب 📲";
        dot.className = "w-2 h-2 rounded-full bg-white inline-block";

        document.getElementById('btnDubPreviewMini').classList.remove('hidden');
        document.getElementById('btnDubPreviewMini').classList.add('inline-flex');
        document.getElementById('btnDubResetMini').classList.remove('hidden');
        document.getElementById('btnDubResetMini').classList.add('inline-flex');

        showToast("🎉 الفيديو والصوت جاهزان! اضغط 'واتساب' للإرسال فوراً", "check");
    };

    if (dubMediaRec && dubMediaRec.state !== 'inactive') {
        dubMediaRec.stop();
    }
}

// دمج الفريمات والصوت في ملف جاهز مسبقاً
async function preRenderVideoFile() {
    if (typeof saveActiveFrame === 'function') saveActiveFrame();

    const loadedImgs = [];
    for (let f of frames) {
        const img = new Image();
        img.src = f;
        await new Promise(r => { img.onload = r; img.onerror = r; });
        loadedImgs.push(img);
    }

    if (loadedImgs.length === 0) return;

    const expCanvas = document.createElement('canvas');
    expCanvas.width = 480;
    expCanvas.height = 480;
    const ctx = expCanvas.getContext('2d');
    const stream = expCanvas.captureStream(30);

    let totalDuration = 3.5;
    if (dubAudioBlob) {
        try {
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === 'suspended') await actx.resume(); // فك تجميد الصوت للأندرويد
            const ab = await dubAudioBlob.arrayBuffer();
            const audioBuf = await actx.decodeAudioData(ab);
            totalDuration = Math.max(audioBuf.duration, 2.0);

            const dest = actx.createMediaStreamDestination();
            const src = actx.createBufferSource();
            src.buffer = audioBuf;
            src.connect(dest);
            src.start(0);

            const aTrack = dest.stream.getAudioTracks()[0];
            if (aTrack) stream.addTrack(aTrack);
        } catch(e) {
            console.warn("Audio attach error:", e);
        }
    }

    let mimeType = 'video/webm';
    if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) mimeType = 'video/mp4;codecs=avc1';
    else if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';

    const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 2500000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

    return new Promise((resolve) => {
        recorder.onstop = () => {
            const videoBlob = new Blob(chunks, { type: mimeType });
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
            readyVideoFile = new File([videoBlob], `كرتون_باسم_ورندا.${ext}`, { type: mimeType });
            resolve();
        };

        recorder.start();

        const currentFps = fps || 6;
        const frameInterval = 1000 / currentFps;
        const startT = performance.now();
        const totalMs = totalDuration * 1000;

        const timer = setInterval(() => {
            const elapsed = performance.now() - startT;
            if (elapsed >= totalMs) {
                clearInterval(timer);
                recorder.stop();
                return;
            }

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 480, 480);

            const idx = Math.floor(elapsed / frameInterval) % loadedImgs.length;
            ctx.drawImage(loadedImgs[idx], 0, 0, 480, 480);
        }, 1000 / 30);
    });
}

// فتح الواتساب فوراً بدون أي تأخير لأن الكبسة مباشرة
async function triggerInstantWhatsAppShare() {
    if (!readyVideoFile) return;

    if (navigator.canShare && navigator.canShare({ files: [readyVideoFile] })) {
        try {
            await navigator.share({
                files: [readyVideoFile],
                title: 'كرتون باسم ورندا 🎬',
                text: 'شوفوا فيلم الكرتون الناطق اللي دبلجناه!'
            });
            showToast("✅ تمت المشاركة في واتساب بنجاح!", "check");
            return;
        } catch (err) {
            console.log("تم إلغاء المشاركة أو إغلاقها");
        }
    }

    // تنزيل كخيار احتياطي إذا لزم
    const url = URL.createObjectURL(readyVideoFile);
    const a = document.createElement('a');
    a.href = url;
    a.download = readyVideoFile.name;
    a.click();
    showToast("✅ تم حفظ الفيديو في الهاتف!", "check");
}

function playDubPreview() {
    if (dubAudioPlayer.src) {
        dubAudioPlayer.currentTime = 0;
        dubAudioPlayer.play();
        if (!isPlaying) startPlayback();
        dubAudioPlayer.onended = () => {
            stopPlayback();
        };
    }
}

function resetDubAction() {
    dubState = 'idle';
    dubAudioBlob = null;
    readyVideoFile = null;
    dubAudioPlayer.src = "";

    const btn = document.getElementById('btnDirectDub');
    const txt = document.getElementById('dubText');
    const dot = document.getElementById('dubDot');

    btn.className = "px-2.5 py-1.5 bg-gradient-to-r from-rose-500 to-pink-600 active:scale-95 text-white rounded-xl text-xs font-black flex items-center gap-1 shadow-md shadow-rose-500/30 transition";
    txt.innerText = "سجّل 🎙️";
    dot.className = "w-2 h-2 rounded-full bg-white inline-block";

    document.getElementById('btnDubPreviewMini').classList.add('hidden');
    document.getElementById('btnDubPreviewMini').classList.remove('inline-flex');
    document.getElementById('btnDubResetMini').classList.add('hidden');
    document.getElementById('btnDubResetMini').classList.remove('inline-flex');

    showToast("جاهز لتسجيل دبلجة جديدة", "rotate-right");
}
